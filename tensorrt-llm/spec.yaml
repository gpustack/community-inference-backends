backend_name: TensorRT-LLM
description: |
  TensorRT-LLM (https://github.com/NVIDIA/TensorRT-LLM) is NVIDIA's high-performance inference engine for large language models on NVIDIA GPUs.
  It provides optimized kernels, in-flight batching, paged KV cache, quantization, and multi-GPU (tensor/pipeline parallelism) support.
  The service is launched with `trtllm-serve`, exposing an OpenAI-compatible HTTP API.
health_check_path: /health
default_version: 1.3.0rc20
default_run_command: trtllm-serve serve {{model_path}} --host {{worker_ip}} --port {{port}}
version_configs:
  1.3.0rc20:
    image_name: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20
    custom_framework: cuda
parameter_format: space
common_parameters:
  - --backend
  - --tp_size
  - --pp_size
  - --ep_size
  - --cp_size
  - --gpus_per_node
  - --max_batch_size
  - --max_num_tokens
  - --max_seq_len
  - --max_beam_width
  - --kv_cache_free_gpu_memory_fraction
  - --kv_cache_dtype
  - --enable_chunked_prefill
  - --enable_attention_dp
  - --trust_remote_code
  - --tokenizer
  - --served_model_name
  - --reasoning_parser
  - --tool_parser
  - --chat_template
  - --num_postprocess_workers
  - --log_level
  - --extra_llm_api_options
is_built_in: false
