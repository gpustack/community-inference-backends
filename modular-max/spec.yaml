backend_name: Modular MAX
description: |
  Modular MAX (https://docs.modular.com/intro) is a heterogeneous inference framework for serving text, embedding, vision, image, video, and audio models on CPUs and NVIDIA or AMD GPUs.
  It exposes OpenAI-compatible APIs and the Open Responses API through `max serve`.

  Model and precision support is architecture-specific. Check the MAX supported-model matrix before deployment:
  https://docs.modular.com/models/
health_check_path: /v1/health
default_version: 26.7.0-cuda
default_run_command: >-
  --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
default_env:
  MAX_SERVE_API_TYPES: '["openai","responses"]'
parameter_format: space
common_parameters:
  - --task
  - --weight-path
  - --quantization-encoding
  - --model-override
  - --subfolder
  - --huggingface-model-revision
  - --huggingface-weight-revision
  - --trust-remote-code
  - --custom-architectures
  - --chat-template
  - --max-length
  - --pool-embeddings
  - --device-memory-utilization
  - --vision-cache-utilization
  - --kv-cache-format
  - --enable-prefix-caching
  - --max-batch-size
  - --max-batch-input-tokens
  - --enable-chunked-prefill
  - --enable-in-flight-batching
  - --max-queue-size
  - --max-pending-requests
  - --device-graph-capture
  - --data-parallel-degree
  - --ep-size
  - --pipeline-role
  - --enable-structured-output
  - --structured-output-backend
  - --tool-parser
  - --reasoning-parser
  - --emit-reasoning-content
  - --enable-penalties
  - --enable-min-tokens
  - --allow-extra-request-fields
  - --enable-lora
  - --lora-paths
  - --max-num-loras
  - --max-lora-rank
  - --speculative-method
  - --draft-model-path
  - --num-speculative-tokens
  - --taylorseer
  - --first-block-caching
  - --use-vendor-blas
  - --pretty-print-config
version_configs:
  26.7.0-cuda:
    image_name: modular/max-nvidia-full:26.7.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices gpu:all
    custom_framework: cuda
  26.7.0-rocm:
    image_name: modular/max-amd:26.7.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices gpu:all
    custom_framework: rocm
  26.7.0-cpu:
    image_name: modular/max-nvidia-base:26.7.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices cpu
    custom_framework: cpu
  26.6.0-cuda:
    image_name: modular/max-nvidia-full:26.6.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices gpu:all
    custom_framework: cuda
  26.6.0-rocm:
    image_name: modular/max-amd:26.6.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices gpu:all
    custom_framework: rocm
  26.6.0-cpu:
    image_name: modular/max-nvidia-base:26.6.0
    run_command: >-
      --model {{model_path}} --port {{port}} --served-model-name {{model_name}}
      --devices cpu
    custom_framework: cpu
framework_index_map:
  cuda:
    - 26.7.0-cuda
    - 26.6.0-cuda
  rocm:
    - 26.7.0-rocm
    - 26.6.0-rocm
  cpu:
    - 26.7.0-cpu
    - 26.6.0-cpu
is_built_in: false
